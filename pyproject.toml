[project]
name = "fingeneval"
version = "0.1.0"
description = "Offline evaluation and release gating for financial RAG configurations"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B105"] # ReleaseOutcome.PASS is an enum, not a credential.
