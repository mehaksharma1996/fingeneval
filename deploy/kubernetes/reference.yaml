apiVersion: apps/v1
kind: Deployment
metadata:
  name: fingeneval-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: fingeneval-api }
  template:
    metadata:
      labels: { app: fingeneval-api }
    spec:
      containers:
        - name: api
          image: replace-with-approved-registry/fingeneval-api:0.1.0
          ports: [{ containerPort: 8000 }]
          env:
            - name: FINGENEVAL_DATABASE_URL
              valueFrom: { secretKeyRef: { name: fingeneval-runtime, key: database-url } }
            - name: FINGENEVAL_LOCAL_AUTH_ENABLED
              value: "false"
          readinessProbe: { httpGet: { path: /health/ready, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: 8000 }, initialDelaySeconds: 10 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: fingeneval-api
spec:
  selector: { app: fingeneval-api }
  ports: [{ port: 8000, targetPort: 8000 }]

