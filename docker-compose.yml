services:
  api:
    build: .
    environment:
      FINGENEVAL_ENVIRONMENT: development
      FINGENEVAL_DATABASE_URL: sqlite:////data/fingeneval.db
      FINGENEVAL_EXECUTION_MODE: eager
      FINGENEVAL_LOCAL_AUTH_ENABLED: "true"
    volumes:
      - fingeneval-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  fingeneval-data:

